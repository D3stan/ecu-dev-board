# Production stack — Dokploy routes the public hostname to the frontend.
# Nginx proxies API and WebSocket traffic to the private backend service.

services:
  db:
    image: timescale/timescaledb:latest-pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecu_password}
      POSTGRES_DB: ${POSTGRES_DB:-ecudb}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecu} -d ${POSTGRES_DB:-ecudb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrations:
    build:
      context: ./backend
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ecu}:${POSTGRES_PASSWORD:-ecu_password}@db:5432/${POSTGRES_DB:-ecudb}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  ecu-dt-backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ecu}:${POSTGRES_PASSWORD:-ecu_password}@db:5432/${POSTGRES_DB:-ecudb}
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8082}:80"
    depends_on:
      - ecu-dt-backend

volumes:
  db_data:
  redis_data:
