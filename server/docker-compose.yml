version: "3.9"

# Production stack — Traefik (via Dokploy) routes directly to the backend.
# No Nginx container is included.

services:
  db:
    image: timescale/timescaledb:latest-pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecu_password}
      POSTGRES_DB: ${POSTGRES_DB:-ecudb}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecu} -d ${POSTGRES_DB:-ecudb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrations:
    build:
      context: ./backend
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ecu}:${POSTGRES_PASSWORD:-ecu_password}@db:5432/${POSTGRES_DB:-ecudb}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ecu}:${POSTGRES_PASSWORD:-ecu_password}@db:5432/${POSTGRES_DB:-ecudb}
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Traefik labels — route APIs/WS to backend, serve root from frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ecu-backend.rule=Host(`${BACKEND_HOST:-localhost}`) && (PathPrefix(`/api`) || PathPrefix(`/ws`) || PathPrefix(`/docs`) || PathPrefix(`/openapi.json`))"
      - "traefik.http.routers.ecu-backend.priority=20"
      - "traefik.http.services.ecu-backend.loadbalancer.server.port=8000"
      # WebSocket passthrough headers
      - "traefik.http.middlewares.ecu-ws.headers.customRequestHeaders.Upgrade=websocket"
      - "traefik.http.middlewares.ecu-ws.headers.customRequestHeaders.Connection=Upgrade"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8082}:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ecu-frontend.rule=Host(`${BACKEND_HOST:-localhost}`)"
      - "traefik.http.routers.ecu-frontend.priority=10"
      - "traefik.http.services.ecu-frontend.loadbalancer.server.port=80"
    depends_on:
      - backend

volumes:
  db_data:
  redis_data:
