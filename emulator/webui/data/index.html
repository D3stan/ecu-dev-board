<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <!-- Mobile-first viewport: no zoom, portrait preferred -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- 🔄 ANTI-CACHE: Forza il browser a NON cachare questa pagina -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <title>FOG EXTRA — Idrobase rev3</title>
  
  <!-- Applica tema salvato IMMEDIATAMENTE per evitare flash -->
  <script>
    // IMPORTANTE: Questo deve essere eseguito PRIMA del CSS!
    try {
      const theme = localStorage.getItem('theme');
      if (theme === 'dark' || theme === 'light') {
        document.documentElement.setAttribute('data-theme', theme);
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    } catch (e) {
      // Fallback in caso di errore localStorage
      document.documentElement.setAttribute('data-theme', 'light');
    }
  </script>
  
  <!-- Component Styles -->

  <!-- Configurazione Socket (DEVE restare qui per placeholder ESP32) -->
  <script>
    // Questo oggetto DEVE rimanere nell'HTML perché il firmware ESP32
    // sostituisce i placeholder {{URL}} e {{MAC}} prima di servire il file
    var URL = "192.168.4.1:3000";
    var MAC = "7C:FA:80:9F:2A:03"; // portatile
    // var MAC = "F4:3B:D8:A0:D8:C2"; // fisso


    // window.APP_CONFIG = {
    //   socketUrl: "{{URL}}",
    //   socketMac: "{{MAC}}"
    // };

    window.APP_CONFIG = {
      socketUrl: URL,
      socketMac: MAC
    };
    
    // 🔄 APP VERSION: Aggiornato ogni volta che ricompili il firmware
    // Se cambia, il browser scarica nuovi file JS/CSS
    window.APP_VERSION = "{{VERSION}}"; // ESP sostituirà con timestamp/version
