<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'/>" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- Anti-cache for development -->
  <meta http-equiv="Cache-Control" content="no-store, max-age=0, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <title>ECU Dashboard — Telemetria & Controllo</title>
  <meta name="description" content="Dashboard telemetria e controllo ECU per motociclo monocilindrico — ESP32-S3">
  
  <!-- Apply saved theme immediately to prevent flash -->
  <script>
    try {
      const theme = localStorage.getItem('theme');
      document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>

  <!-- App version — overwritten by Vite build plugin from package.json -->
  <script>
    window.APP_VERSION = "0.1.0";
  </script>

  <!-- Main stylesheet (includes design tokens, layout, utilities) -->
  <link rel="stylesheet" href="./css/styles.css">

  <!-- Component styles -->
  <link rel="stylesheet" href="./css/components/RpmGauge.css">
  <link rel="stylesheet" href="./css/components/TpsBar.css">
  <link rel="stylesheet" href="./css/components/EgtIndicator.css">
  <link rel="stylesheet" href="./css/components/FsmBadge.css">
  <link rel="stylesheet" href="./css/components/TelemetryValue.css">
  <link rel="stylesheet" href="./css/components/MapEditor.css">
  <link rel="stylesheet" href="./css/components/MapCurve.css">
  <link rel="stylesheet" href="./css/components/MapSelector.css">
  <link rel="stylesheet" href="./css/components/QsButton.css">
  <link rel="stylesheet" href="./css/components/OtaStatus.css">
  <link rel="stylesheet" href="./css/components/ConnectionBadge.css">

  <!-- Page styles -->
  <link rel="stylesheet" href="./css/pages/DashboardPage.css">
  <link rel="stylesheet" href="./css/pages/MapsPage.css">
  <link rel="stylesheet" href="./css/pages/SettingsPage.css">
</head>

<body>
  <!-- APP ROOT -->
  <div id="app" class="app-container">
    
    <!-- TOP BAR -->
    <div class="top-bar"></div>

    <!-- PAGES CONTAINER -->
    <div class="pages-container"></div>

  </div>

  <!-- SIDEBAR CONTAINER -->
  <div id="sidebar-container"></div>

  <!-- MODAL CONTAINER -->
  <div id="modal-manager-container"></div>

  <!-- WebSocket Configuration -->
  <script>
    const isDev = true;

    if (!isDev) {
      window.APP_CONFIG = {
        socketUrl: window.location.hostname + "/ws",
        autoConnectSocket: true,
        useMockData: false
      };
    } else {
      window.APP_CONFIG = {
        socketUrl: "192.168.1.65/ws",
        autoConnectSocket: false,
        useMockData: true,
        enableDebugLogs: true
      };
    }
  </script>
  
  <!-- Main application bootstrap -->
  <script type="module" src="./js/main.js"></script>
</body>
</html>
