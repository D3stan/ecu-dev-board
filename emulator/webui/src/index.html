<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <!-- Mobile-first viewport: no zoom, portrait preferred -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- 🔄 ANTI-CACHE: Forza il browser a NON cachare questa pagina -->
  <!-- NOTE: These meta tags are belt-and-suspenders. Real enforcement is via HTTP headers on the server. -->
  <meta http-equiv="Cache-Control" content="no-store, max-age=0, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <title>FOG EXTRA — Idrobase rev3</title>
  
  <!-- Applica tema salvato IMMEDIATAMENTE per evitare flash -->
  <script>
    // IMPORTANTE: Questo deve essere eseguito PRIMA del CSS!
    try {
      const theme = localStorage.getItem('theme');
      if (theme === 'dark' || theme === 'light') {
        document.documentElement.setAttribute('data-theme', theme);
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    } catch (e) {
      // Fallback in caso di errore localStorage
      document.documentElement.setAttribute('data-theme', 'light');
    }
  </script>

  <!-- APP VERSION — defined here so it is available before JS/CSS loads.
       Bumped manually (or via package.json) on every firmware+asset release.
       The Vite build plugin overwrites this value from package.json automatically. -->
  <script>
    window.APP_VERSION = "1.0.3";
  </script>

  <link rel="stylesheet" href="./css/styles.css">
  
  <!-- Component Styles -->
  <link rel="stylesheet" href="./css/components/Sidebar.css">
  <link rel="stylesheet" href="./css/components/LanguageDropdown.css">
  <link rel="stylesheet" href="./css/components/Modal.css">
  <link rel="stylesheet" href="./css/components/PageTopBar.css">
  <link rel="stylesheet" href="./css/components/LoadingSpinner.css">
  <link rel="stylesheet" href="./css/components/ParameterItem.css">
  <link rel="stylesheet" href="./css/components/GanttChart.css">
  <link rel="stylesheet" href="./css/components/TimeSlotRender.css">
  <link rel="stylesheet" href="./css/components/AddTimeSlotButton.css">
  <link rel="stylesheet" href="./css/components/WiFiCardInputSendBase.css">
  <link rel="stylesheet" href="./css/components/TimeSlot.css">
  <link rel="stylesheet" href="./css/components/TimeSlotGauge.css">
  <link rel="stylesheet" href="./css/components/InputTimer.css">
  <link rel="stylesheet" href="./css/components/InputNumber.css">
  <link rel="stylesheet" href="./css/components/Badge.css">
  <link rel="stylesheet" href="./css/components/ModeSelector.css">
  <link rel="stylesheet" href="./css/components/PowerButton.css">
  <link rel="stylesheet" href="./css/components/Banner.css">
  
  <!-- Page Styles -->
  <link rel="stylesheet" href="./css/pages/WifiPage.css">



</head>

<body>
  <!-- ============================================
       APP ROOT
       ============================================ -->
  <div id="app" class="app-container">
    
    <!-- TOP BAR - Container popolato dal componente TopBar -->
    <div class="top-bar"></div>

    <!-- PAGES CONTAINER -->
    <!-- Le pagine vengono create dinamicamente dai Page components e appese qui -->
    <div class="pages-container"></div>

  </div>

  <!-- ============================================
       SIDEBAR CONTAINER (popolato da SidebarManager)
       ============================================ -->
  <div id="sidebar-container"></div>

  <!-- ============================================
       MODAL CONTAINER (popolato da ModalManager)
       ============================================ -->
  <div id="modal-manager-container"></div>

  <!-- ============================================
       TEMPLATES (da popolare incrementalmente)
       ============================================ -->

  <!-- ============================================
       JAVASCRIPT BOOTSTRAP
       ============================================ -->
  
  <!-- Configurazione Socket (FASE 1: MAC rimosso, URL auto-detect) -->
  <script>
    // FASE 1+4: Auto-detect WebSocket URL da window.location.hostname
    // MAC completamente rimosso — zero retrocompatibilità
    // STABILITY FIX: WS URL computed entirely in browser — no server templating

    const isDev = true;

    if (!isDev) {
      window.APP_CONFIG = {
        socketUrl: window.location.hostname + "/ws"
      };
    } else {
      window.APP_CONFIG = {
        // socketUrl: "192.168.4.1/ws" // AP
        // socketUrl: "10.247.193.85/ws" // S22 Ultra
        socketUrl: "192.168.1.65/ws" // wind andrea 10.247.193.85 ababab
        // socketUrl: "10.247.193.85/ws" // wind andrea 
      };
    }

  </script>
  
  <!-- Main application bootstrap -->
  <script type="module" src="./js/main.js"></script>

</body>
