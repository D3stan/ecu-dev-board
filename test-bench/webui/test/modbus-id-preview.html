<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ModbusID – Preview Identificatori</title>

<style>
    body {
        margin: 0;
        font-family: "Inter", sans-serif;
        background: #f4f8fb;
        color: #0c2d48;
    }

    .page {
        max-width: 480px;
        margin: auto;
        padding: 20px;
    }

    h1 {
        text-align: center;
        font-size: 26px;
        font-weight: 700;
        margin-top: 10px;
        margin-bottom: 20px;
    }

    /* --- CARD PRINCIPALE --- */
    .card {
        background: #fff;
        padding: 24px 20px;
        border-radius: 20px;
        box-shadow: 0px 4px 10px rgba(0,0,0,0.05);
        text-align: center;
    }

    /* NUMERO CENTRALE */
    .id-display {
        font-size: 40px;
        font-weight: 700;
        margin-bottom: 12px;
    }

    /* FRECCE */
    .arrow-btn {
        border: none;
        background: none;
        font-size: 30px;
        padding: 5px 12px;
        cursor: pointer;
        color: #093a61;
    }
    .arrow-btn:active {
        transform: scale(0.9);
    }

    /* SLIDER */
    .slider-container {
        margin-top: 10px;
        margin-bottom: 20px;
    }
    input[type="range"] {
        width: 100%;
        accent-color: #093a61;
    }

    /* LABELS 0 - 10 (range) */
    .range-labels {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        opacity: 0.7;
        margin-top: -5px;
    }

    /* SEZIONE PREVIEW */
    .preview-box {
        margin-top: 24px;
        background: #f1f6fa;
        padding: 16px;
        border-radius: 16px;
        text-align: left;
        font-size: 15px;
        color: #0c2d48;
    }
    .preview-box strong {
        color: #093a61;
    }

    /* BOTTONI FINALI */
    .button-row {
        margin-top: 22px;
        display: flex;
        justify-content: space-between;
    }
    .btn-reset, .btn-confirm {
        padding: 12px 22px;
        border-radius: 12px;
        font-size: 16px;
        cursor: pointer;
        border: 2px solid #0c2d48;
    }
    .btn-reset {
        background: white;
        color: #0c2d48;
    }
    .btn-confirm {
        background: #0c2d48;
        color: white;
    }
</style>

</head>
<body>

<div class="page">

    <h1>ID Macchina (Modbus / AP / DNS)</h1>

    <div class="card">

        <!-- FRECCE + NUMERO -->
        <div>
            <button class="arrow-btn" id="minusBtn">‹</button>
            <span class="id-display" id="modbusId">3</span>
            <button class="arrow-btn" id="plusBtn">›</button>
        </div>

        <!-- SLIDER -->
        <div class="slider-container">
            <input type="range" id="idSlider" min="0" max="10" value="3">
            <div class="range-labels">
                <span>0</span><span>10</span>
            </div>
        </div>

        <!-- PREVIEW IDENTIFICATORI -->
        <div class="preview-box">
            <div>Modbus ID: <strong id="p-modbus">3</strong></div>
            <div>Wi-Fi AP: <strong id="p-ap">fogExtra-3</strong></div>
            <div>DNS locale: <strong id="p-dns">fogextra-3.local</strong></div>
        </div>

        <!-- BOTTONI -->
        <div class="button-row">
            <button class="btn-reset" id="resetBtn">Ripristina</button>
            <button class="btn-confirm">Conferma</button>
        </div>

    </div>
</div>

<script>
    const idEl = document.getElementById("modbusId");
    const slider = document.getElementById("idSlider");
    const minusBtn = document.getElementById("minusBtn");
    const plusBtn = document.getElementById("plusBtn");

    const pModbus = document.getElementById("p-modbus");
    const pAp = document.getElementById("p-ap");
    const pDns = document.getElementById("p-dns");

    const resetBtn = document.getElementById("resetBtn");

    function updatePreview(value) {
        idEl.textContent = value;
        pModbus.textContent = value;
        pAp.textContent = `fogExtra-${value}`;
        pDns.textContent = `fogextra-${value}.local`;
    }

    slider.addEventListener("input", (e) => updatePreview(e.target.value));

    minusBtn.addEventListener("click", () => {
        let v = parseInt(slider.value);
        if (v > 0) slider.value = v - 1;
        updatePreview(slider.value);
    });

    plusBtn.addEventListener("click", () => {
        let v = parseInt(slider.value);
        if (v < 10) slider.value = v + 1;
        updatePreview(slider.value);
    });

    resetBtn.addEventListener("click", () => {
        slider.value = 3;
        updatePreview(3);
    });

    // init
    updatePreview(slider.value);
</script>

</body>
</html>
